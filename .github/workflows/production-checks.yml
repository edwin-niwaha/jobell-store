name: Production checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: jobell_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: jobell_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobell_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: core.settings.test
      TEST_DATABASE_URL: postgres://jobell_test:test-only-password@127.0.0.1:5432/jobell_test
      CHECKOUT_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-production.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libcairo2 libpango-1.0-0 libpangoft2-1.0-0
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements-production.txt pip-audit
      - run: python -m pip check
      - run: python -m pip_audit --local
      - name: Install browser checks
        run: |
          npm install --prefix /tmp/jobell-browser playwright
          /tmp/jobell-browser/node_modules/.bin/playwright install --with-deps chromium
          echo "NODE_PATH=/tmp/jobell-browser/node_modules" >> "$GITHUB_ENV"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - name: Validate production settings
        env:
          DJANGO_SETTINGS_MODULE: core.settings.production
          SECRET_KEY: ci-only-production-check-abcdefghijklmnopqrstuvwxyz-1234567890
          SITE_URL: https://jobellinc.com
          BASE_DOMAIN: jobellinc.com
          DATABASE_URL: postgres://jobell_test:test-only-password@127.0.0.1:5432/jobell_test
          DB_SSL_REQUIRE: 'False'
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder
          RESEND_API_KEY: ci-placeholder
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
        run: python manage.py check --deploy --fail-level WARNING
      - name: Build production image
        run: docker build --tag jobell-store:check .
