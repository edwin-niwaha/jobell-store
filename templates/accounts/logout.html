{% extends 'accounts/base.html' %}

{% block title %}
  Logged Out
{% endblock %}

{% block content %}
  <section class="platform-info-page platform-centered-page">
    <div class="platform-info-panel platform-status-panel">
      <span class="platform-status-icon"><i class="mdi mdi-check"></i></span>
      <h1>Successfully logged out</h1>
      <p>Thanks for visiting {{ site_name|upper }}. Your account session has ended.</p>
      <a href="{% url 'login' %}" class="platform-page-button">Log in again</a>
    </div>
  </section>
{% endblock %}
