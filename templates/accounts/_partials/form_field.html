<div class="account-field {% if field.errors %}has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %}<span class="account-optional">Optional</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="account-help" id="{{ field.id_for_label }}-help">{{ field.help_text|safe }}</div>{% endif %}
  {% if field.errors %}<div class="account-error" id="{{ field.id_for_label }}-errors">{% for error in field.errors %}<p>{{ error }}</p>{% endfor %}</div>{% endif %}
</div>
