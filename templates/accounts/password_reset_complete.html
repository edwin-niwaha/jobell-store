{% extends "accounts/base.html" %}

{% block title %}
  Password Reset Complete
{% endblock title %}

{% block content %}
  <section class="jobell-info-page jobell-centered-page">
    <div class="jobell-info-panel jobell-status-panel">
      <span class="jobell-status-icon"><i class="mdi mdi-lock-check-outline"></i></span>
      <h1>Password reset complete</h1>
      <p>Your password has been updated. You can now sign in with the new password.</p>
      <a href="{% url 'login' %}" class="jobell-page-button">Go to login</a>
    </div>
  </section>
{% endblock content %}
