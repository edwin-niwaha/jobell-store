{% extends "accounts/base.html" %}

{% block title %}
  Password Reset Complete
{% endblock title %}

{% block content %}
  <section class="platform-info-page platform-centered-page">
    <div class="platform-info-panel platform-status-panel">
      <span class="platform-status-icon"><i class="mdi mdi-lock-check-outline"></i></span>
      <h1>Password reset complete</h1>
      <p>Your password has been updated. You can now sign in with the new password.</p>
      <a href="{% url 'login' %}" class="platform-page-button">Go to login</a>
    </div>
  </section>
{% endblock content %}
